[package]
name = "esp32c3-current-monitor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"

[dependencies]
critical-section = "1.1.2"
document-features = "0.2.7"
embassy-executor = { version = "0.9.1", features = ["nightly"] }
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["generic-queue-8"] }
embassy-time-driver = { version = "0.2.1", features = ["tick-hz-1_000_000"] }

esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.0", default-features = false, features = [
    "esp32c3",
    "println",
    "panic-handler",
    "halt-cores",
] }
esp-println = { version = "0.16.0", features = [ "esp32c3", "auto", "log-04"], default-features = false}
esp-hal = { version = "1.0.0-rc.1", features = [
   "esp32c3",
   "unstable",
] }
esp-rtos = { version = "0.2.0", features = [
    "esp32c3",            # Compatible with all chips
    "embassy",
] }
esp-bootloader-esp-idf = { version = "0.3.0", features = ["esp32c3"] }

log = { version = "0.4.20" }
r0 = { version = "1.0.0" }
static_cell = { version = "2.0.0", features = ["nightly"] }
usb-device = { version = "0.3.1", features = ["control-buffer-256"] }
usbd-serial = "0.2.0"
embedded-hal-async = "1.0.0"
embedded-hal = "1.0.0"
smart-leds = "0.4.0"

embedded-graphics = "0.8.1"
embedded-hal-bus = { version = "0.3.0", features = ["async"] }
ssd1306-i2c = "0.1.5"
ina3221 = { git = "https://github.com/leighleighleigh/ina3221", version = "0.4.5" }
nb = "1.1.0"

[profile.release]
#debug = false
#opt-level = 3
debug = false
#strip = true 
strip = "debuginfo"
opt-level = "s" # size is an important factor in the ULP code,  because it's easy to run out of space.
codegen-units = 1 # LLVM can perform better optimizations using a single thread
lto = true

[profile.dev]
opt-level = 0

[[bin]]
path = "src/main.rs"
name = "app"
test = false
bench = false

